  <h3>Classes and Objects</h3>

<p>
Classes and Objects are the foundation of Object Oriented Programming. Every OOP program is built using these two concepts.
</p>

<h4>What is a Class?</h4>
<p>
A class is a blueprint or template used to create objects. It defines the structure and behavior (attributes and methods) that the objects will have.
</p>

<ul>
  <li>A class is not a real object</li>

<p>

</p>

<ul>

  <li>It can perform actions using methods</li>

<h4>Difference Between Class and Object</h4>

<p>

</p>

<h4>Attributes</h4>
<p>
Attributes are variables inside a class that store data about an object. They describe the properties or state of an object.
</p>

<ul>

</p>

<h4>Difference Between Attributes and Methods</h4>

</p>

</ul>

<h3>Encapsulation</h3>

<p>
Encapsulation is one of the fundamental principles of Object Oriented Programming. It refers to the process of wrapping data (attributes) and methods (functions) into a single unit (class) while restricting direct access to some of the object’s components.
</p>

<h4>Meaning</h4>
<p>
Encapsulation means "data hiding" — it protects the internal state of an object and only allows access through defined methods.
</p>

<h4>Why Encapsulation is Important</h4>
<ul>
  <li>It protects data from unauthorized access</li>
  <li>It helps control how data is modified</li>
  <li>It improves security of the program</li>
  <li>It makes code easier to maintain and debug</li>
</ul>

<h4>How Encapsulation Works</h4>
<p>
In encapsulation, class variables are usually made private, and access is provided using special methods called getters and setters.
</p>

<ul>
  <li><b>Getter:</b> used to read or access data</li>
  <li><b>Setter:</b> used to modify or update data</li>
</ul>

<h4>Example Analogy</h4>
<p>
Think of a bank account:
</p>

<ul>
  <li>You cannot directly change your balance</li>
  <li>You must use methods like deposit() or withdraw()</li>
  <li>The system controls how money is added or removed</li>
</ul>

<h4>Real-Life Example</h4>
<p>
A capsule medicine is a good example of encapsulation. The inside medicine is hidden and protected, but you can still use it by taking the capsule.
</p>

<h4>Advantages of Encapsulation</h4>
<ul>
  <li>Improves security of data</li>
  <li>Reduces complexity</li>
  <li>Helps control access to data</li>
  <li>Makes the system more flexible and maintainable</li>
</ul>

<h4>Disadvantages of Encapsulation</h4>
<ul>
  <li>Can increase code complexity</li>
  <li>Requires extra methods (getters/setters)</li>
  <li>May make development slightly slower</li>
</ul>

<h3>Inheritance</h3>

<p>
Inheritance is a fundamental principle of Object Oriented Programming that allows one class to acquire the properties and behaviors (attributes and methods) of another class.
</p>

<h4>Meaning</h4>
<p>
It is a mechanism where a new class (child class) is derived from an existing class (parent class), promoting code reuse and hierarchy.
</p>

<h4>Types of Inheritance</h4>
<ul>
  <li><b>Single Inheritance:</b> One child class inherits from one parent class</li>
  <li><b>Multilevel Inheritance:</b> A class inherits from a class which is also a child of another class</li>
  <li><b>Hierarchical Inheritance:</b> Multiple child classes inherit from one parent class</li>
  <li><b>Multiple Inheritance:</b> A class inherits from more than one parent class (supported in some languages like C++)</li>
</ul>

<h4>Key Terms</h4>
<ul>
  <li><b>Parent Class (Superclass):</b> The class being inherited from</li>
  <li><b>Child Class (Subclass):</b> The class that inherits properties</li>
</ul>

<h4>Importance of Inheritance</h4>
<ul>
  <li>Promotes code reusability</li>
  <li>Reduces repetition of code</li>
  <li>Makes code easier to maintain</li>
  <li>Improves organization of programs</li>
</ul>

<h4>Real-Life Analogy</h4>
<p>
Think of inheritance like family traits:
</p>

<ul>
  <li>A child inherits eye color, height, or facial features from parents</li>

</p>

<ul>

<h3>Polymorphism</h3>

<p>
Polymorphism is one of the core principles of Object Oriented Programming. It means "many forms", where a single action or method can behave in different ways depending on the context.
</p>

<h4>Meaning</h4>
<p>
Polymorphism allows methods to perform different tasks based on the object that is calling them or the parameters passed to them.
</p>

<h4>Types of Polymorphism</h4>

<ul>
  <li><b>Compile-time Polymorphism (Method Overloading):</b> Same method name but different parameters</li>
  <li><b>Run-time Polymorphism (Method Overriding):</b> A child class provides a specific implementation of a method already defined in the parent class</li>
</ul>

<h4>Method Overloading</h4>
<p>
This occurs when multiple methods have the same name but different number or type of parameters.
</p>

<p><b>Example idea:</b> A function called "add()" can add two numbers or three numbers depending on inputs.</p>

<h4>Method Overriding</h4>
<p>
This happens when a child class redefines a method that already exists in the parent class.
</p>

<p><b>Example idea:</b> A general class "Animal" has a method sound(), but a "Dog" class overrides it to bark().
</p>

<h4>Importance of Polymorphism</h4>

<ul>
  <li>Makes code more flexible and reusable</li>
  <li>Reduces complexity by using one interface for different behaviors</li>
  <li>Improves scalability of applications</li>
  <li>Makes programs easier to extend</li>
</ul>

<h4>Real-Life Analogy</h4>
<p>
Think of a person who behaves differently depending on situation:
</p>

<ul>
  <li>At school → student behavior</li>
  <li>At home → child behavior</li>
  <li>At work → employee behavior</li>
</ul>

<p>Same person, different behaviors = Polymorphism</p>

<h4>Programming Example Idea</h4>

<ul>
  <li>Shape → draw()</li>
  <li>Circle → draw() draws a circle</li>
  <li>Square → draw() draws a square</li>
</ul>

<h3>Abstraction</h3>

<p>
Abstraction is one of the fundamental principles of Object Oriented Programming that focuses on hiding complex implementation details and showing only the essential features of an object.
</p>

<h4>Meaning</h4>
<p>
Abstraction means simplifying reality by exposing only what is necessary and hiding internal details that are not needed by the user.
</p>

<h4>How Abstraction Works</h4>
<p>
In abstraction, the user only interacts with the functionality of an object, without knowing how it is implemented internally.
</p>

<ul>
  <li>Focus is on WHAT an object does, not HOW it does it</li>
</ul>

<h4>Types of Abstraction</h4>

<ul>
  <li><b>Abstract Classes:</b> Classes that cannot be instantiated and may contain abstract methods</li>
  <li><b>Interfaces:</b> A blueprint that defines methods without implementation (depending on language)</li>
</ul>

<h4>Importance of Abstraction</h4>

<ul>
  <li>Reduces complexity of systems</li>
  <li>Improves code readability and maintainability</li>
  <li>Helps focus on essential features only</li>
  <li>Increases security by hiding internal details</li>
</ul>

<h4>Real-Life Analogy</h4>
<p>
Think of using a car:
</p>

<ul>
  <li>You press the accelerator to move</li>
  <li>You press the brake to stop</li>
</ul>

<p>
You don’t need to know how the engine works internally — that complexity is hidden from you.
</p>

<h4>Another Example</h4>
<p>
When you use a phone app:
</p>

<ul>
  <li>You tap icons to perform actions</li>
  <li>You don’t see the backend code or system processes</li>
</ul>

<h4>Programming Idea Example</h4>

<ul>
  <li>A class "BankSystem" provides withdraw() and deposit()</li>
  <li>The user doesn’t see how balance calculations are done internally</li>
</ul>

<h3>Constructors and Destructors</h3>

<h4>Constructor</h4>
<p>
A constructor is a special method in a class that is automatically called when an object is created. It is used to initialize the object.
</p>

<h4>Types of Constructors</h4>
<ul>
  <li><b>Default Constructor:</b> Takes no parameters and assigns default values</li>
  <li><b>Parameterized Constructor:</b> Takes parameters to initialize objects with specific values</li>
  <li><b>Copy Constructor:</b> Creates a new object using an existing object</li>
</ul>

<h4>Importance of Constructors</h4>
<ul>
  <li>Automatically initializes objects</li>
  <li>Saves time in setting up values</li>
  <li>Makes code cleaner and more organized</li>
</ul>

<h4>Deconstructor</h4>
<p>
A deconstructor is a special method used to destroy objects and free up memory when the object is no longer needed.
</p>

<h4>Importance of Deconstructors</h4>
<ul>
  <li>Frees memory automatically</li>
  <li>Helps manage system resources</li>
  <li>Prevents memory leaks</li>
</ul>

<h4>Simple Analogy</h4>
<ul>
  <li>Constructor = building a house</li>
  <li>Destructor = demolishing the house when it's no longer needed</li>
</ul>

<h3>Exception Handling</h3>

<p>
Exception handling is a mechanism used to handle runtime errors and prevent programs from crashing unexpectedly.
</p>

<h4>Meaning</h4>
<p>
An exception is an unexpected error that occurs during program execution. Exception handling allows the program to deal with these errors gracefully.
</p>

<h4>Key Keywords</h4>
<ul>
  <li><b>try:</b> Block of code that may cause an error</li>
  <li><b>catch:</b> Handles the error if it occurs</li>
  <li><b>finally:</b> Executes code regardless of error</li>
  <li><b>throw:</b> Used to manually trigger an exception</li>
</ul>

<h4>Importance</h4>
<ul>
  <li>Prevents program crashes</li>
  <li>Improves user experience</li>
  <li>Makes debugging easier</li>
  <li>Ensures program continues running safely</li>
</ul>

Think of an ATM machine:
</p>

<ul>

</ul>

<h3>File Handling</h3>

<p>
File handling is the process of storing data in files and retrieving it when needed. It allows programs to work with permanent data storage.
</p>

<h4>Meaning</h4>
<p>
Instead of losing data when a program closes, file handling allows data to be saved in files for later use.
</p>

<h4>File Operations</h4>
<ul>
  <li><b>Create:</b> Creating a new file</li>
  <li><b>Write:</b> Adding data to a file</li>
  <li><b>Read:</b> Retrieving data from a file</li>
  <li><b>Append:</b> Adding data without deleting existing content</li>
</ul>

<h4>Importance of File Handling</h4>
<ul>
  <li>Permanent data storage</li>
  <li>Easy data retrieval</li>
  <li>Useful for large applications</li>

<p>
Dynamic memory allocation is the process of allocating memory to a program during runtime (while the program is running) instead of compile time.
</p>

<h4>Meaning</h4>
<p>
It allows programs to request memory when needed and release it when no longer required, making programs more flexible and efficient.
</p>

<ul>

<ul>
  <li>Efficient use of memory</li>

<p>

<ul>
  <li><b>Input:</b> Data entered into the system</li>
  <li><b>Processing:</b> CPU performs operations on data</li>
  <li><b>Storage:</b> Data is saved temporarily or permanently</li>
  <li><b>Output:</b> Final result is displayed or delivered</li>
</ul>

<p>
Think of a computer as a human system:
</p>

<ul>
  <li>Brain → CPU (processes information)</li>
  <li>Memory → Human memory (stores information)</li>
  <li>Eyes/Ears → Input devices</li>
  <li>Mouth/Hands → Output devices</li>
</ul>

<p>
Computer architecture explains how all these parts work together efficiently.
</p>

<h2>CPU Structure and Function</h2>

<h3>Meaning of CPU</h3>
<p>
The Central Processing Unit (CPU) is the brain of the computer. It is responsible for executing instructions, performing calculations, and controlling all operations within the computer system.
</p>

<p>
Every task a computer performs is processed and managed by the CPU.
</p>

<h3>Main Components of the CPU</h3>

<ul>
  <li><b>Arithmetic Logic Unit (ALU):</b> Performs arithmetic operations (addition, subtraction, etc.) and logical operations (comparisons like AND, OR)</li>

  <li><b>Control Unit (CU):</b> Directs and coordinates all activities inside the computer. It ensures instructions are executed in the correct order</li>

  <li><b>Registers:</b> Small, very fast storage locations inside the CPU used to temporarily store data and instructions</li>
</ul>

<h3>Functions of the CPU</h3>

<ul>
  <li>Fetching instructions from memory</li>
  <li>Decoding instructions to understand what needs to be done</li>
  <li>Executing instructions (processing data)</li>
  <li>Storing results back into memory</li>
</ul>

<h3>How the CPU Works (Simple View)</h3>

<p>
The CPU works by continuously repeating a cycle called the instruction cycle. It fetches instructions, decodes them, executes them, and stores the result.
</p>

<h3>Importance of the CPU</h3>

<ul>
  <li>It is the core processing unit of the computer</li>
  <li>Determines how fast a computer performs tasks</li>
  <li>Controls all hardware and software operations</li>
  <li>Executes all user instructions</li>
</ul>


<p>
Think of the CPU as the manager of a company:
</p>

<ul>
  <li>ALU → Workers who perform calculations</li>
  <li>Control Unit → Manager giving instructions</li>
  <li>Registers → Notepad used for quick notes</li>
</ul>

<p>
Without the manager (CPU), nothing in the system can function properly.
</p>

<h2>Instruction Cycle</h2>

<h3>Meaning of Instruction Cycle</h3>
<p>
The instruction cycle is the process by which a computer fetches, decodes, executes, and stores instructions. It describes the steps the CPU follows to complete a single machine instruction.
</p>

<p>
Every instruction given to the computer goes through this repeated cycle for processing.
</p>

<h3>Stages of the Instruction Cycle</h3>

<ul>
  <li><b>1. Fetch:</b> The CPU retrieves the instruction from main memory (RAM)</li>
  <li><b>2. Decode:</b> The CPU interprets the instruction to understand what action is required</li>
  <li><b>3. Execute:</b> The CPU performs the operation (e.g., calculations, data movement)</li>
  <li><b>4. Store:</b> The result of the execution is saved back to memory or registers</li>
</ul>

<h3>Explanation of Each Stage</h3>

<h4>Fetch Stage</h4>
<p>
The control unit retrieves the instruction from memory using the program counter, which keeps track of the next instruction to be executed.
</p>

<h4>Decode Stage</h4>
<p>
The instruction is broken down into parts so the CPU can understand what operation is required and which data is involved.
</p>

<h4>Execute Stage</h4>
<p>
The ALU (Arithmetic Logic Unit) performs the required operation such as addition, subtraction, or logical comparison.
</p>

<h4>Store Stage</h4>
<p>
The result produced from execution is stored either in a register or written back into memory.
</p>

<h3>Importance of Instruction Cycle</h3>

<ul>
  <li>It explains how the CPU processes all instructions</li>
  <li>It forms the basis of computer processing</li>
  <li>It helps improve system performance understanding</li>
  <li>It is essential for CPU design and optimization</li>
</ul>
<p>
Think of a student solving an exam question:
</p>

<ul>
  <li>Fetch → Read the question</li>
  <li>Decode → Understand what is being asked</li>
  <li>Execute → Solve the question</li>
  <li>Store → Write down the answer</li>
</ul>

<p>
The CPU repeats this process millions of times per second.
</p>

<h2>Memory Hierarchy</h2>

<h3>Meaning of Memory Hierarchy</h3>
<p>
Memory hierarchy refers to the arrangement of different types of memory in a computer system based on their speed, cost, and size. It is designed to provide a balance between fast access and large storage capacity.
</p>

<p>
The closer the memory is to the CPU, the faster and more expensive it is. The farther it is, the slower but cheaper and larger it becomes.
</p>

<h3>Levels of Memory Hierarchy</h3>

<ul>
  <li><b>1. Registers:</b> Smallest and fastest memory located inside the CPU. Used for temporary storage of data during processing.</li>

  <li><b>2. Cache Memory:</b> High-speed memory between CPU and RAM. Stores frequently used data to reduce access time.</li>

  <li><b>3. Main Memory (RAM):</b> Stores data and instructions currently being used by the computer.</li>

  <li><b>4. Secondary Storage:</b> Permanent storage such as Hard Disk Drives (HDD) and Solid State Drives (SSD).</li>

  <li><b>5. Tertiary Storage:</b> External storage like backup drives, CDs, and cloud storage systems.</li>
</ul>

<h3>Characteristics of Memory Levels</h3>

<ul>
  <li>Registers → Fastest, smallest, most expensive per bit</li>
  <li>Cache → Very fast, small size, reduces CPU waiting time</li>
  <li>RAM → Medium speed, temporary storage</li>
  <li>Secondary Storage → Large capacity, slower speed</li>
</ul>

<h3>Importance of Memory Hierarchy</h3>

<ul>
  <li>Improves overall system performance</li>
  <li>Reduces time taken to access data</li>
  <li>Balances cost and efficiency</li>
  <li>Ensures smooth execution of programs</li>
</ul>

<p>
Think of a student’s study setup:
</p>

<ul>
  <li>Registers → Things in your hand while solving questions</li>
  <li>Cache → Notes on your desk</li>
  <li>RAM → Your study table</li>
  <li>Storage → Bookshelf or library</li>
  <li>Cloud → External library or online resources</li>
</ul>

<p>
The closer the resource, the faster you can access it.
</p>

<h2>Types of Computer Architecture</h2>

<h3>Overview</h3>
<p>
Computer architecture is generally classified into different types based on how instructions and data are stored and processed. The two major types are Von Neumann Architecture and Harvard Architecture.
</p>

<h3>1. Von Neumann Architecture</h3>

<p>
Von Neumann Architecture is a computer design model where both data and instructions are stored in the same memory and use the same bus system for processing.
</p>

<h4>Characteristics</h4>
<ul>
  <li>Single memory for data and instructions</li>
  <li>Uses one bus system for fetching data and instructions</li>
  <li>Sequential execution of instructions</li>
</ul>

<h4>Advantages</h4>
<ul>
  <li>Simpler design and implementation</li>
  <li>Cost-effective</li>
  <li>Easier to program and manage</li>
</ul>

<h4>Disadvantages</h4>
<ul>
  <li>Slower processing due to shared bus (Von Neumann bottleneck)</li>
  <li>Limited performance in high-speed systems</li>
</ul>

<h3>2. Harvard Architecture</h3>

<p>
Harvard Architecture is a computer design model where data and instructions are stored in separate memory units with separate buses for access.
</p>

<h4>Characteristics</h4>
<ul>
  <li>Separate memory for instructions and data</li>
  <li>Separate buses for data and instructions</li>
  <li>Can fetch instructions and data simultaneously</li>
</ul>

<h4>Advantages</h4>
<ul>
  <li>Faster processing speed</li>
  <li>Improved performance due to parallel access</li>
  <li>Reduces bottlenecks</li>
</ul>

<h4>Disadvantages</h4>
<ul>
  <li>More complex design</li>
  <li>Higher cost of implementation</li>
</ul>

<h3>Difference Between Von Neumann and Harvard Architecture</h3>

<ul>
  <li><b>Memory:</b> Von Neumann uses shared memory, Harvard uses separate memory</li>
  <li><b>Speed:</b> Harvard is faster due to parallel access</li>
  <li><b>Complexity:</b> Von Neumann is simpler, Harvard is more complex</li>
  <li><b>Cost:</b> Von Neumann is cheaper, Harvard is more expensive</li>
</ul>

<p>
Think of a kitchen setup:
</p>

<ul>
  <li>Von Neumann → One chef using the same space for cooking and plating (slower)</li>
  <li>Harvard → One chef cooking while another handles plating separately (faster)</li>
</ul>

<h2>Performance Factors of Computer Systems</h2>

<h3>Meaning of Computer Performance</h3>
<p>
Computer performance refers to how efficiently and quickly a computer system can execute tasks and process instructions. It determines how fast a system responds to user inputs and runs applications.
</p>

<h3>Factors Affecting Computer Performance</h3>

<h4>1. CPU Speed (Clock Speed)</h4>
<p>
Clock speed refers to how many instructions the CPU can execute per second, measured in GHz (Gigahertz). The higher the clock speed, the faster the computer processes instructions.
</p>

<h4>2. Number of Cores</h4>
<p>
Modern CPUs have multiple cores, allowing them to perform multiple tasks at the same time (parallel processing). More cores generally improve performance.
</p>

<h4>3. Cache Memory</h4>
<p>
Cache memory is a small, very fast memory located inside or near the CPU. It stores frequently used data to reduce access time to main memory.
</p>

<h4>4. RAM Size</h4>
<p>
Random Access Memory (RAM) temporarily stores data and programs currently in use. A larger RAM allows the computer to handle more tasks at once without slowing down.
</p>

<h4>5. Bus Speed</h4>
<p>
Bus speed refers to how fast data is transferred between different components of the computer system. Faster bus speed improves overall system performance.
</p>

<h4>6. Storage Type</h4>
<p>
The type of storage device affects performance. Solid State Drives (SSD) are faster than Hard Disk Drives (HDD), leading to quicker boot times and file access.
</p>

<h3>Other Factors</h3>

<ul>
  <li>Efficiency of software programs</li>
  <li>Operating system optimization</li>
  <li>Background processes running on the system</li>
</ul>

<h3>Importance of Performance Optimization</h3>

<ul>
  <li>Improves system responsiveness</li>
  <li>Enhances user experience</li>
  <li>Allows smooth multitasking</li>
  <li>Reduces system lag and delays</li>
</ul>

<p>
Think of a computer like a delivery company:
</p>

<ul>
  <li>CPU speed → How fast the delivery driver moves</li>
  <li>Cores → Number of drivers available</li>
  <li>RAM → Packages ready for delivery</li>
  <li>Cache → Items kept in the car for quick access</li>
  <li>Storage → Warehouse for all goods</li>
</ul>

<h2>Instruction Set Architecture (ISA)</h2>

<h3>Meaning of ISA</h3>
<p>
Instruction Set Architecture (ISA) refers to the part of a computer architecture that defines the set of instructions a processor can execute. It acts as a bridge between software (programs) and hardware (CPU).
</p>

<p>
In simple terms, ISA tells the computer what operations it can perform and how those instructions are structured.
</p>

<h3>Components of ISA</h3>

<ul>
  <li><b>Instructions:</b> Commands given to the CPU (e.g., add, move, store)</li>
  <li><b>Registers:</b> Small storage locations inside the CPU used during execution</li>
  <li><b>Addressing Modes:</b> Ways in which instructions access data in memory</li>
  <li><b>Data Types:</b> Types of data the CPU can process (integer, float, etc.)</li>
</ul>

<h3>Types of Instructions in ISA</h3>

<ul>
  <li><b>Data Transfer Instructions:</b> Move data between memory and registers</li>
  <li><b>Arithmetic Instructions:</b> Perform mathematical operations like addition and subtraction</li>
  <li><b>Logical Instructions:</b> Perform logic operations like AND, OR, NOT</li>
  <li><b>Control Instructions:</b> Control program flow (loops, jumps, branches)</li>
</ul>

<h3>Importance of ISA</h3>

<ul>
  <li>Defines how software communicates with hardware</li>
  <li>Determines CPU capabilities</li>
  <li>Helps in designing compilers and operating systems</li>
  <li>Improves software-hardware compatibility</li>
</ul>

<p>
Think of ISA like a language dictionary:
</p>

<ul>
  <li>CPU = person</li>
  <li>ISA = language they understand</li>
  <li>Programs = instructions written in that language</li>
</ul>

<p>
If the CPU doesn’t understand the instruction set, it cannot execute the program.
</p>

<h2>Pipelining</h2>

<h3>Meaning of Pipelining</h3>
<p>
Pipelining is a technique used in computer architecture where multiple instructions are overlapped in execution. It improves the speed of processing by allowing the CPU to work on different stages of multiple instructions at the same time.
</p>

<p>
Instead of waiting for one instruction to complete fully before starting the next, pipelining breaks instruction execution into stages and processes them simultaneously.
</p>

<h3>Stages of Instruction Pipeline</h3>

<ul>
  <li><b>Fetch:</b> Retrieve instruction from memory</li>
  <li><b>Decode:</b> Interpret the instruction</li>
  <li><b>Execute:</b> Perform the operation</li>
  <li><b>Store:</b> Save the result</li>
</ul>

<h3>How Pipelining Works</h3>
<p>
While one instruction is being decoded, another can be fetched, and another can be executed. This overlapping increases CPU efficiency and reduces idle time.
</p>

<h3>Advantages of Pipelining</h3>

<ul>
  <li>Increases instruction throughput</li>
  <li>Improves CPU performance</li>
  <li>Reduces idle time of CPU components</li>
  <li>Allows parallel processing of instructions</li>
</ul>

<h3>Disadvantages of Pipelining</h3>

<ul>
  <li>Complex hardware design</li>
  <li>Pipeline hazards can reduce efficiency</li>
  <li>Difficult to manage dependencies between instructions</li>
</ul>

<h3>Types of Pipeline Hazards</h3>

<ul>
  <li><b>Structural Hazard:</b> Resource conflicts when hardware is insufficient</li>
  <li><b>Data Hazard:</b> Occurs when instructions depend on previous results</li>
  <li><b>Control Hazard:</b> Caused by branch and jump instructions</li>
</ul>

<p>
Think of a car assembly line:
</p>

<ul>
  <li>One worker installs wheels</li>
  <li>Another installs doors</li>
  <li>Another paints the car</li>
</ul>

<p>
Instead of building one car at a time, multiple cars are being worked on simultaneously at different stages.
</p>

<h2>Interrupts</h2>

<h3>Meaning of Interrupts</h3>
<p>
An interrupt is a signal that temporarily stops the CPU from its current execution in order to handle an important event or task.
</p>

<p>
After handling the interrupt, the CPU resumes its previous task from where it stopped.
</p>

<h3>Why Interrupts are Needed</h3>
<p>
Without interrupts, the CPU would have to continuously check for events, which wastes time and reduces efficiency. Interrupts allow the CPU to respond only when needed.
</p>

<h3>Types of Interrupts</h3>

<ul>
  <li><b>Hardware Interrupts:</b> Generated by external devices like keyboard, mouse, printer</li>
  <li><b>Software Interrupts:</b> Generated by programs or system calls</li>
  <li><b>Internal Interrupts (Exceptions):</b> Caused by errors like division by zero</li>
</ul>

<h3>Steps in Interrupt Handling</h3>

<ul>
  <li>1. Interrupt signal is generated</li>
  <li>2. CPU pauses current execution</li>
  <li>3. CPU saves current state (context)</li>
  <li>4. Interrupt Service Routine (ISR) is executed</li>
  <li>5. CPU restores previous state</li>
  <li>6. Execution continues from where it stopped</li>
</ul>

<h3>Importance of Interrupts</h3>

<ul>
  <li>Improves CPU efficiency</li>
  <li>Allows multitasking</li>
  <li>Ensures quick response to important events</li>
  <li>Prevents CPU from wasting time checking devices continuously</li>
</ul>

<p>
Think of a student studying:
</p>

<ul>
  <li>The student is studying (CPU executing program)</li>
  <li>A phone call comes in (interrupt)</li>
  <li>The student pauses studying and answers the call</li>
  <li>After the call, the student continues studying from where they stopped</li>
</ul>
